apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-api
  namespace: application-ns
  labels:
    app: mock-api

spec:
  replicas: 4

  selector:
    matchLabels:
      app: mock-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: mock-api

    spec:
      containers:
        - name: mock-api
          image: supratimbhattacharjee/demo-social-media-app:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

      terminationGracePeriodSeconds: 30